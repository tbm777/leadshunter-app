name: Google categories

# Which Google Maps categories each industry's search results really have (category names and counts only).
on: workflow_dispatch

permissions:
  contents: read

jobs:
  categories:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore gosom
        id: gosom
        uses: actions/cache@v4
        with:
          path: gmaps
          key: gosom-1.9.2
      - name: Download gosom 1.9.2
        if: steps.gosom.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 4 -o gmaps https://github.com/gosom/google-maps-scraper/releases/download/v1.9.2/google_maps_scraper-1.9.2-linux-amd64
          chmod +x gmaps
      - name: Tally categories
        env:
          GMAPS_BIN: ./gmaps
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          chmod +x gmaps
          node scripts/categories.mjs
