name: Accuracy check

# The robot visits a sample of real leads in test mode (fills the form, never submits) and compares its verdict with the
# website check's label. Totals only in the logs, never lead data.
on:
  workflow_dispatch:
    inputs:
      sample:
        description: Leads to check (max 150)
        required: false
        default: '60'
      search:
        description: Which leads (all, or latest = the most recent search only)
        required: false
        default: 'all'

permissions:
  contents: read

jobs:
  precision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore browser
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: playwright-1.48.2-v1
      - name: Install browser
        run: |
          npm install --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAMPLE: ${{ inputs.sample }}
          SEARCH: ${{ inputs.search }}
        run: node scripts/precision.mjs
