name: Usage report

# Cloudflare usage for the last few days against the free limits, and which database queries read the most rows.
# Prints totals and query shapes only (never lead data).
on: workflow_dispatch

permissions:
  contents: read

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/usage.mjs
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
