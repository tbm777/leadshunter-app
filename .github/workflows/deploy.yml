name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check secrets
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APP_PASSWORD RUNNER_SECRET GH_TOKEN; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - run: npm ci
      - name: Run tests
        run: npm test
      - name: Restore place data
        id: geo
        uses: actions/cache@v4
        with:
          path: public/geo
          key: geo-v1
      - name: Build place data from GeoNames
        if: steps.geo.outputs.cache-hit != 'true'
        run: node scripts/build-geo.mjs
      - name: Create database and storage if needed
        run: node scripts/provision.mjs
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply leadshunter --remote
      - name: Package the browser extension
        run: |
          mkdir -p /tmp/ext && cp -r extension /tmp/ext/leadshunter-extension
          (cd /tmp/ext && zip -qr "$GITHUB_WORKSPACE/public/leadshunter-extension.zip" leadshunter-extension)
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Set Worker secrets
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: |
          node -e 'const e=process.env,o={APP_PASSWORD:e.APP_PASSWORD,RUNNER_SECRET:e.RUNNER_SECRET,GH_TOKEN:e.GH_TOKEN};if(e.CF_ANALYTICS_TOKEN)o.CF_ANALYTICS_TOKEN=e.CF_ANALYTICS_TOKEN;require("fs").writeFileSync("/tmp/secrets.json",JSON.stringify(o))'
          npx wrangler secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json
