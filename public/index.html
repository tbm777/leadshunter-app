<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  <meta name="leadshunter-app" content="1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LeadsHunter</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23EE6420'/%3E%3Ccircle cx='12' cy='12' r='6' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='2.2' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
  html,body{margin:0}
  .login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
  .login form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
  .login h1{margin:0;font-size:20px}
  .login p{margin:0;color:var(--muted);font-size:13px}
  .nav a.soon{opacity:.45;pointer-events:none}
  .nav a.soon small{margin-left:auto;font-size:10.5px;color:var(--rail-dim);text-transform:uppercase;letter-spacing:.06em}
  .banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:12px;border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--surface));font-size:13px}
  .banner b{display:block;margin-bottom:2px}
  .boot{min-height:100vh;display:grid;place-items:center;color:var(--muted);font-size:13px}
  .attrib{font-size:11px;color:var(--rail-dim);padding:0 6px}
  .attrib a{color:inherit}
</style>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"><div class="boot"><span><span class="spin"></span>&nbsp; Loading LeadsHunter…</span></div></div>
<div id="overlay"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
